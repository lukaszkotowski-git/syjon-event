# Środowisko developerskie: baza + API (tsx watch) + Vite dev server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syjonevent
      POSTGRES_PASSWORD: syjonevent
      POSTGRES_DB: syjonevent
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syjonevent']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma migrate deploy --schema prisma/schema.prisma && npm run build -w @syjonevent/shared && npm run dev -w @syjonevent/api"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://syjonevent:syjonevent@db:5432/syjonevent
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build -w @syjonevent/shared && npm run dev -w @syjonevent/web -- --host"
    environment:
      VITE_API_PROXY: http://api:4000
    depends_on:
      - api
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data:
