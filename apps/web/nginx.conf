server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # API i webhook Paynow trafiają do backendu w tej samej sieci compose.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:4000/health;
  }

  # Dokumenty prawne pod krótkimi adresami — PDF serwowany bezpośrednio, adres w przeglądarce
  # zostaje /terms i /policy. To samo mapowanie jest w vite.config.ts (dev) — aktualizuj oba miejsca.
  location = /terms {
    alias "/usr/share/nginx/html/Regulamin serwisu internetowego 5.05.2026.pdf";
    types { }
    default_type application/pdf;
    add_header Content-Disposition 'inline; filename="Regulamin serwisu internetowego 5.05.2026.pdf"';
  }

  location = /policy {
    alias "/usr/share/nginx/html/Polityka prywatnosci 27.04.2026.pdf";
    types { }
    default_type application/pdf;
    add_header Content-Disposition 'inline; filename="Polityka prywatnosci 27.04.2026.pdf"';
  }

  # SPA fallback — /f/:slug i /potwierdzenie/:id obsługuje React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
